name: timeserver
description: "GPS-disciplined SNTP/NTP time server for Android — Flutter port of PublicNTP time-server-app."
publish_to: "none"
version: 1.0.30+10

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1

  # Charts (packets/min + signal strength)
  fl_chart: ^0.69.2

  # Platform helpers
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  network_info_plus: ^6.1.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
