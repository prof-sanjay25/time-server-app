name: Build Flutter APK

on:
  push:
    branches: ["claude/inspiring-meitner-3jDYF"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.0"

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: flutter_timeserver
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_timeserver
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests
        working-directory: flutter_timeserver
        run: flutter test

      - name: Build debug APK
        working-directory: flutter_timeserver
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeserver-debug-apk
          path: flutter_timeserver/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
